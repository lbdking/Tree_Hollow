apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: tree-hollow
data:
  APP_NAME: "TreeHollow"
  APP_ENV: "prod"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  DATABASE_URL: "mysql+pymysql://root:@mysql:3306/tree_hollow?charset=utf8mb4"
  REDIS_URL: "redis://redis:6379/0"
  JWT_ALG: "HS256"
  JWT_EXPIRE_MINUTES: "10080"
  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  DEEPSEEK_MODEL: "deepseek-chat"
  AI_CONTEXT_WINDOW: "20"
  AI_CACHE_FILE: "/app/data/ai_cache.json"
  TZ: "Asia/Shanghai"
---
# 敏感数据用 Secret 单独管理
# 部署时记得：kubectl -n tree-hollow create secret generic backend-secret \
#   --from-literal=JWT_SECRET=$(openssl rand -base64 36) \
#   --from-literal=DEEPSEEK_API_KEY=sk-xxx \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: tree-hollow
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_WITH_RANDOM_STRING"
  DEEPSEEK_API_KEY: "sk-REPLACE_ME_WITH_YOUR_DEEPSEEK_KEY"
